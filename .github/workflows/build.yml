name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Lint
        run: cargo clippy --release --all-targets

      - name: Build app bundle
        run: ./scripts/bundle.sh --universal

      - name: Verify the bundle
        run: |
          lipo -archs "dist/YouTube Music.app/Contents/MacOS/ytmusic"
          codesign --verify --strict "dist/YouTube Music.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/YouTube Music.app" YouTube-Music-macos-universal.zip
          shasum -a 256 YouTube-Music-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: YouTube-Music-macos-universal.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" YouTube-Music-macos-universal.zip --clobber

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: cargo clippy --release --all-targets

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/ytmusic.exe "staging/YouTube Music.exe"
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath YouTube-Music-windows-x64.zip -Force
          Get-FileHash YouTube-Music-windows-x64.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: YouTube-Music-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" YouTube-Music-windows-x64.zip --clobber
