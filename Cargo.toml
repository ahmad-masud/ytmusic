[package]
name = "ytmusic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight native desktop app for YouTube Music, for macOS and Windows"
license = "MIT"
build = "build.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
muda = "0.21"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
arboard = "3.7.0"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Media", "Media_Playback", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
